services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notebookyt
      POSTGRES_USER: notebookyt
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebookyt -d notebookyt"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    secrets:
      - source: editorial_connection
        target: ConnectionStrings__Editorial
    volumes:
      - media_data:/var/lib/notebook-yt/media
      - protection_keys:/var/lib/notebook-yt/keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    build: .
    command: ["--migrate"]
    secrets:
      - source: editorial_connection
        target: ConnectionStrings__Editorial
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  database_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set a private local password file path}
  editorial_connection:
    file: ${EDITORIAL_CONNECTION_FILE:?Set a private local connection string file path}
volumes:
  postgres_data:
  media_data:
  protection_keys:
